services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: still
      POSTGRES_USER: still
      POSTGRES_PASSWORD: still
    ports:
      - "5432:5432"
    volumes:
      - still_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro

volumes:
  still_pgdata:

services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_DB: gallery
      POSTGRES_USER: gallery
      POSTGRES_PASSWORD: gallery
    ports:
      - "5432:5432"
    volumes:
      - gallery_pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro

volumes:
  gallery_pgdata:
